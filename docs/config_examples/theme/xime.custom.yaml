metadata:
  app_name: Xime
  app_version: ">=2.4.2"
  platform: android
  config_version: 1
  generator: "Xime Config Generator" # 暂时无用
  modified_time: "2026-06-18"

# `color_schemes` 配色方案：
# - name / primary_color：必填
# - keyboard_background：可选，背景类型（纯色/渐变/图片），不填则使用 keyboard.colors 全局默认
#
# 纯色背景：
#   keyboard_background:
#     type: solid
#     color: 0xRRGGBB             # 亮色
#     color_dark: 0xRRGGBB        # 暗色（可选，不填则自动暗化）
#
# 渐变背景：
#   keyboard_background:
#     type: gradient
#     colors: [0xRRGGBB, ...]     # 亮色渐变断点（至少 2 个）
#     colors_dark: [0xRRGGBB, ...] # 暗色渐变断点（可选）
#     angle: 135                   # 角度制，0=左→右，90=下→上
#
# 图片背景：
#   keyboard_background:
#     type: image
#     src: "themes/bg.png"          # 相对于 assets/
#     src_dark: "themes/bg_night.png" # 暗色变体（可选）
#     fit: cover                    # cover | contain | fill | fit_width | fit_height | none

color_schemes:
style:
  color_scheme:
    light: zine_light
    dark: zine_dark
  dark_mode: 2

color_schemes:
  zine_light:
    name: "银灰 · 浅"
    primary_color: 0x9E9E9E
    keyboard_background:
      type: gradient
      colors: [0xF5F5F5, 0xFFFFFF]
      colors_dark: [0x2A2A2A, 0x1E1E1E]
      angle: 0
  
  zine_medium:
    name: "中灰 · 中"
    primary_color: 0x616161
    keyboard_background:
      type: solid
      color: 0xF0F0F0
      color_dark: 0x252525
  
  zine_dark:
    name: "烟灰 · 深"
    primary_color: 0x424242
    keyboard_background:
      type: gradient
      colors: [0xE0E0E0, 0xF5F5F5]
      colors_dark: [0x1A1A1A, 0x2D2D2D]
      angle: 90
  
  zine_deep:
    name: "墨灰 · 浓"
    primary_color: 0x212121
    keyboard_background:
      type: solid
      color: 0xE8E8E8
      color_dark: 0x121212
