name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        timeout-minutes: 15
        run: ./gradlew downloadOnnx --no-daemon --info

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs (Unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Plugin XIPKs (Unsigned)
        run: bash scripts/build-plugins.sh

      - name: Sign Main App APKs (optional)
        uses: r0adkll/sign-android-release@v1
        id: sign_main_app
        if: ${{ secrets.SIGNING_KEY != '' }}
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Find APKs and plugin XIPKs
        id: find_apks
        run: |
          # 优先取签名后的 APK；若签名未执行或失败，则回退到未签名 APK
          MAIN_APKS=$(find app/build/outputs/apk/release -name "*-signed.apk" -type f | sort | tr '\n' ',' | sed 's/,$//')
          if [ -z "$MAIN_APKS" ]; then
            MAIN_APKS=$(find app/build/outputs/apk/release -name "Xime-*.apk" ! -name "*-aligned.apk" -type f | sort | tr '\n' ',' | sed 's/,$//')
            echo "::warning::No signed APKs found, falling back to unsigned APKs."
          fi
          PLUGIN_XIPKS=$(find build/plugin-release -name "*.xipk" -type f 2>/dev/null | sort | tr '\n' ',' | sed 's/,$//')

          echo "main_apks=$MAIN_APKS" >> $GITHUB_OUTPUT
          echo "plugin_xipks=$PLUGIN_XIPKS" >> $GITHUB_OUTPUT

          if [ -z "$MAIN_APKS" ]; then
            echo "::error::No main app APKs found!"
            exit 1
          fi
          if [ -z "$PLUGIN_XIPKS" ]; then
            echo "::warning::No plugin XIPKs found!"
          fi

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: |
            ${{ steps.find_apks.outputs.main_apks }}
            ${{ steps.find_apks.outputs.plugin_xipks }}
          retention-days: 14

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Xime ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ${{ steps.find_apks.outputs.main_apks }}
            ${{ steps.find_apks.outputs.plugin_xipks }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
