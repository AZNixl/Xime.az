# ════════════════════════════════════════════════════════════════════════════
#  Xime 键盘配置文件（曦码输入法.az 修改版）
#
#  原版项目：Xime —— https://github.com/ximeiorg/Xime
#  本文件为修改版（曦码输入法.az，包名 com.kingzcheung.xime.az），基于 Xime v2.6.2。
#
#  相对原版的主要修改：
#    1. ?123 键保持 mode_change，不固定数字键盘（长按弹 t9/t26 选择）
#    2. 移除退格键滑动选中删除，仅保留点删 / 上滑清空 / 下滑撤回
#    3. 光标移动手势迁移到候选栏（空格键滑动不再移动光标）
#    4. 空格键去除中/英角标，支持自定义显示文本（设置页配置）
#    5. 键盘第 1~4 行高度可逐行调节；新增可选「增高行」（纯空白第五行）
#    6. 密码框内英文直出（不上屏联想），设置页有开关
#    7. xime.yaml 外置：优先读 /Documents/Xime/rime/xime.yaml，不存在时回退 assets
#    8. WebDAV 同步范围改为整个 /Documents/Xime/ 目录（跳过 fonts/build）
#    9. 支持自定义键盘字体（/Documents/Xime/fonts/ 下的 ttf/otf）
#   10. 中文区 qwerty 去除下滑五笔字根气泡，改为常用符号上屏
#   11. 中英键盘 A/X/C/V 长按新增 全选/剪切/复制/粘贴 快捷键
#
#  ── 手势 action 值速查（keyboard/GestureAction.kt）──
#  可用于 tap / swipe_up / swipe_down / long_press 的 { label, action, value } 中：
#    commit         上屏文本（value 为上屏内容，不指定则用 label）
#    command        内置命令，value 为命令名：
#                     clear_composition  清空当前输入编码和候选词
#                     show_ime_picker    弹出系统输入法选择器
#    select_all     全选
#    cut            剪切
#    copy           复制
#    paste          粘贴
#    line_start     光标移到行首
#    line_end       光标移到行尾
#    undo           撤销
#    delete         删除/退格（由 UI 层拦截处理）
#    repeat         重复上一次输入
#    none           仅显示，无操作
#    toggle_ascii   切换中/英文输入模式（UI 层处理）
#    toggle_symbols 切换符号键盘（UI 层处理）
#    switch_route   切换键盘路由/面板，如 emoji（UI 层处理）
#
#  修改本文件后重启输入法生效；手机上编辑 /Documents/Xime/rime/xime.yaml 即可，
#  无需重新打包（外置文件优先于 assets 内置版本）。
# ════════════════════════════════════════════════════════════════════════════
metadata:
  app_name: Xime
  app_version: ">=2.5.0"
  platform: android
  config_version: 1
  generator: "Xime Config Generator" # 暂时无用
  modified_time: "2026-08-21"

xime_index:
  # 方案/插件/模型市场索引端点（ximeiorg/xime-index）。
  # 可替换为自建代理/镜像，下载器按顺序依次尝试，直到成功为止。
  # 末尾需要 /。
  base_urls:
    - "https://cdn.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://fastly.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://index.ximei.me/"
    - "https://raw.githubusercontent.com/ximeiorg/xime-index/refs/heads/main/"

style:
  # 浅色/深色模式的配色，deep 为降级后备
  color_scheme:
    light: lavender_purple
    dark: slate_gray
  # 显示模式：0=浅色, 1=深色, 2=跟随系统（默认）
  dark_mode: 2

# 配色方案可配置背景类型（纯色/渐变/图片），默认均为纯色。
# 如需渐变/图片背景，在 xime.custom.yaml 的对应主题下覆盖 keyboard_background 即可：
#
#   keyboard_background:
#     type: gradient
#     colors: [0x8F73E2, 0xE8DEF8]        # 亮色渐变断点
#     colors_dark: [0x4A3F7A, 0x2D2040]    # 暗色渐变断点（可选）
#     angle: 90                            # 角度制
#  
#   keyboard_background:
#     type: image
#     src: "themes/lavender_bg.png"          # 相对于 rime/ 用户目录（优先）或 assets/
#     fit: cover                             # cover | contain | fill | fit_width | fit_height | none
#
# 自定义图片背景有两种方式：
# 1. 在系统相册/文件管理中把图片「分享到 Xime」，图片会自动存入
#    rime/themes/custom_<时间戳>.jpg，并把可用的 color_schemes 配置模板复制到剪贴板，
#    粘贴到 rime/xime.custom.yaml 后即可在主题设置中选择。
# 2. 手动把图片放入 rime/themes/（如通过 USB 或文件管理器），然后在
#    xime.custom.yaml 中添加引用它的 color_scheme，src 写相对 rime/ 的路径。
#    内置主题的同名文件会被用户目录中的文件覆盖。
#
# color_schemes 每个主题可用的颜色字段（未设置的会回退到全局 keyboard.colors 默认值）：
#   primary_color          - 主题强调色（种子色）
#   keyboard_bg_color      - 键盘背景后备色（配置了 keyboard_background 时以 background 为准）
#   key_bg_color / key_bg_color_dark           - 按键底色（亮/暗）
#   special_key_bg_color / _dark               - 特殊按键底色（亮/暗）
#   candidate_bar_bg_color                     - 候选栏底色
#   key_text_color / key_text_color_dark       - 按键文字色（亮/暗）
#   candidate_text_color / _dark               - 候选文字色（亮/暗）
#   candidate_selected_text_color / _dark      - 候选选中文字色（亮/暗），未设置时回退到
#                                                 key_text_color（图片背景看不清时建议单独配置）
#
