# ── 26 键全键盘手势配置 ──
# 每个按键可定义 4 个手势：
#   tap:        点按
#   swipe_up:   上滑
#   swipe_down: 下滑
#   long_press: 长按（数组，弹出气泡后左右滑动选择）
#
# 每个手势的值格式：
#   - 字符串 "a" → 上屏该文本，显示也是它
#   - { label, action, value }
#     label:  按键上显示的文字
#     action: 动作名（完整列表见文件头部「手势 action 值速查」注释）
#     value:  上屏时的输出文本 / command 的命令名（不指定则用 label）
#
# long_press 示例（弹出多个选项供滑动选择）：
#   long_press: { display: "bubble", values: [ { label: "大写", action: "commit", value: "A" }, { label: "Ä", action: "commit", value: "ä" } ] }
#   # 也支持字符串简写：
#   long_press: { display: "bubble", values: ["q", "Q"] }
keyboard:
  # ── 内置默认符号版本号 ──
  # 每次调整内置按键符号（长按/上滑等）时 +1。
  # app 启动发现该版本高于已应用版本时，会用内置 xime.yaml 覆盖用户目录的同名文件，
  # 并清空「设置→键盘符号编辑」的自定义（kime_settings.user_key_overrides）——
  # 否则「用户目录的旧 xime.yaml」+「自定义覆盖」会联手把新的内置默认挡住，
  # 表现为改了 assets/xime.yaml 却毫无变化。
  symbols_version: 2

  # ── 键盘颜色配置（可选，不设置则使用内置默认值）──
  # 背景色已由 color_schemes.*.keyboard_background 接管
  # key_bg_color             - 按键底色（亮色）
  # key_bg_color_dark        - 按键底色（暗色）
  # special_key_bg_color     - 特殊按键底色（亮色）
  # special_key_bg_color_dark- 特殊按键底色（暗色）
  # key_text_color           - 按键文字颜色（亮色）
  # key_text_color_dark      - 按键文字颜色（暗色）
  # candidate_text_color     - 候选文字颜色（亮色）
  # candidate_text_color_dark- 候选文字颜色（暗色）
  colors:
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x60FFFFFF
    # special_key_bg_color: 0x9fef86 #不设置时默认取主题色
    # special_key_bg_color_dark: 0x4A4A4A #不设置时默认取主题色
    key_text_color: 0x202124
    key_text_color_dark: 0xE8EAED
    candidate_text_color: 0x202124
    candidate_text_color_dark: 0xE8EAED
  
  # ── 按键配置（可选，不设置则使用默认值）──
  # corner_radius:      按键圆角半径（dp，默认 8），独立于 shadow.shape_radius
  key:
    corner_radius: 8

  # ── 按键阴影（可选，不设置则使用默认值）──
  # enabled:            是否启用阴影
  # elevation:          阴影高度（dp，默认 0.5）
  shadow:
    enabled: true
    elevation: 0.5
  qwerty:
    # ── 按键布局模式 ──
    # standard: 默认布局（主文字居中，下滑提示在底部）
    # compact: 紧凑布局（主文字在左上，下滑提示占满键帽中部）
    button_layout: standard
    layout:
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [z, x, c, v, b, n, m]
    keys:
      # ── 第一行（q~p）：长按直发 1~0，不弹气泡 ──
      # long_press.display: "none"=无长按, "key"=直发第一项（无气泡）, "bubble"=弹气泡
      # 本布局已清除全部 swipe_up / swipe_down，只保留长按
      q: { tap: "q", long_press: { display: "key", values: ["1"] } }
      w: { tap: "w", long_press: { display: "key", values: ["2"] } }
      e: { tap: "e", long_press: { display: "key", values: ["3"] } }
      r: { tap: "r", long_press: { display: "key", values: ["4"] } }
      t: { tap: "t", long_press: { display: "key", values: ["5"] } }
      y: { tap: "y", long_press: { display: "key", values: ["6"] } }
      u: { tap: "u", long_press: { display: "key", values: ["7"] } }
      i: { tap: "i", long_press: { display: "key", values: ["8"] } }
      o: { tap: "o", long_press: { display: "key", values: ["9"] } }
      p: { tap: "p", long_press: { display: "key", values: ["0"] } }

      # ── 第二行（a~l）：长按直发符号，k 键长按弹气泡选括号 ──
      a: { tap: "a", long_press: { display: "key", values: [ { label: "全选", action: "select_all" } ] } }
      s: { tap: "s", long_press: { display: "key", values: ["-"] } }
      d: { tap: "d", long_press: { display: "key", values: ["@"] } }
      f: { tap: "f", long_press: { display: "key", values: ["#"] } }
      g: { tap: "g", long_press: { display: "key", values: ["/"] } }
      h: { tap: "h", long_press: { display: "key", values: ["_"] } }
      j: { tap: "j", long_press: { display: "key", values: ["+"] } }
      k: { tap: "k", long_press: { display: "bubble", values: ["(", ")", "[", "]", "{", "}"] } }
      l: { tap: "l", long_press: { display: "key", values: ["="] } }
      # ── 第三行（z~m）：长按直发符号 / 编辑动作 ──
      z: { tap: "z", long_press: { display: "key", values: ["`"] } }
      x: { tap: "x", long_press: { display: "key", values: [ { label: "剪切", action: "cut" } ] } }
      c: { tap: "c", long_press: { display: "key", values: [ { label: "复制", action: "copy" } ] } }
      v: { tap: "v", long_press: { display: "key", values: [ { label: "粘贴", action: "paste" } ] } }
      b: { tap: "b", long_press: { display: "key", values: ['"'] } }
      n: { tap: "n", long_press: { display: "key", values: ["'"] } }
      m: { tap: "m", long_press: { display: "key", values: ["："] } }
      # ── 第四行: 暂时不受layout控制 ──
      #  逗号键：点按逗号，长按气泡选叹号/顿号/分号（label 中文显示，value 为提交值）
      "'": { tap: { label: "，", value: "," }, long_press: { display: "bubble", values: [ { label: "！", action: "commit", value: "!" }, { label: "、", action: "commit", value: "、" }, { label: "；", action: "commit", value: ";" } ] } }
      # 句号键：点按句号，长按气泡选问号/叹号/输入法选择（中英切换已移至空格长按）
      earth: { tap: { label: "。", value: "." }, long_press: { display: "bubble", values: [ { label: "？", action: "commit", value: "?" }, { label: "！", action: "commit", value: "!" }, { label: "选择输入法", action: "command", value: "show_ime_picker" } ] } }

  # 英文键盘布局
  qwerty_en:
    # ── 按键布局模式 ──
    # standard: 默认布局（主文字居中，下滑提示在底部）
    # compact: 紧凑布局（主文字在左上，下滑提示占满键帽中部）
    button_layout: standard
    layout:
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [z, x, c, v, b, n, m]
    keys:
      # ── 第一行 ──
      q: { tap: "q", swipe_up: "1", long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "2", long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "3", long_press: { display: "bubble", values: ["e", "E"] } }
      r: { tap: "r", swipe_up: "4", long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "5", long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "6", long_press: { display: "bubble", values: ["y", "Y"] } }
      u: { tap: "u", swipe_up: "7", long_press: { display: "bubble", values: ["u", "U"] } }
      i: { tap: "i", swipe_up: "8", long_press: { display: "bubble", values: ["i", "I"] } }
      o: { tap: "o", swipe_up: "9", long_press: { display: "bubble", values: ["o", "O"] } }
      p: { tap: "p", swipe_up: "0", long_press: { display: "bubble", values: ["p", "P"] } }
      # ── 第二行 ──
      a: { tap: "a", swipe_up: "~", long_press: { display: "bubble", values: [ { label: "全选", action: "select_all" }, "a", "A"] } }
      s: { tap: "s", swipe_up: "/", long_press: { display: "bubble", values: ["s", "S"] } }
      d: { tap: "d", swipe_up: ":", long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: ";", long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "\"", long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "\"", long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "-", long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "(", long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: ")", long_press: { display: "bubble", values: ["l", "L"] } }
      # ";": { tap: ";", shift: ":" }

      # ── 第三行 ──
      z: { tap: "z", swipe_up: "*", long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: "@", long_press: { display: "bubble", values: [ { label: "剪切", action: "cut" }, "x", "X"] } }
      c: { tap: "c", swipe_up: "、", long_press: { display: "bubble", values: [ { label: "复制", action: "copy" }, "c", "C"] } }
      v: { tap: "v", swipe_up: "?", long_press: { display: "bubble", values: [ { label: "粘贴", action: "paste" }, "v", "V"] } }
      b: { tap: "b", swipe_up: "!", long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: "%", long_press: { display: "bubble", values: ["n", "N"] } }
      m: { tap: "m", swipe_up: "#", long_press: { display: "bubble", values: ["m", "M"] } }
      #  逗号键：点按逗号，长按气泡选叹号
      "'": { tap: { label: ",", value: "," }, long_press: { display: "bubble", values: [ "!", "，" ] } }
      # 句号键：点按句号，长按气泡选问号/输入法选择
      earth: { tap: { label: ".", value: "." }, long_press: { display: "bubble", values: [ "?", "。", { label: "选择输入法", action: "command", value: "show_ime_picker" } ] } }
